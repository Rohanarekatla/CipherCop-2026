name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node tests (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Syntax-check browser and serverless code
        run: |
          for f in app/*.js lib/*.js lib/ai/*.js scripts/*.js; do node --check "$f"; done
          node --check Aditya/api/notify.js

  data:
    name: Real-data checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuilding data/buildings.json from Malik/ gives the committed file
        run: |
          python scripts/build-buildings.py
          git diff --exit-code -- data/buildings.json data/waterlogging.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuilding data/netra/ (AI-NETRA footprints and evidence) from Malik/ gives the committed files
        run: |
          node scripts/build-netra.js
          git diff --exit-code -- data/netra
      - name: All JSON data parses
        run: |
          python - <<'PY'
          import json, pathlib
          bad = []
          for p in pathlib.Path("data").rglob("*.json"):
              try: json.loads(p.read_text(encoding="utf-8"))
              except Exception as e: bad.append((str(p), str(e)))
          assert not bad, bad
          print("ok")
          PY
      - name: No file over 50 MB (GitHub warns at 50, rejects at 100)
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +50M -print)
          test -z "$big" || { echo "$big"; exit 1; }

  malik-python:
    name: AI-NETRA-GEO backend compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q Malik/api.py Malik/waterlogging_api.py Malik/scripts

  site:
    name: Static site builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start the server and request every file the app loads
        run: |
          node server.js &
          sleep 2
          for p in "" app/app.js app/style.css data/base.json data/hand.json data/buildings.json data/waterlogging.json data/replay/2024-09-01.json netra/ app/netra.js lib/netra.js data/netra/buildings.json data/netra/evidence.json firesight/ firesight/respond.js site-nav.js report.html app/ideas.js lib/water.js lib/vision.js data/water.json data/sachet.json data/tgrac/segments.json data/tgrac/waterlogging.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8520/$p")
            echo "$code $p"; test "$code" = 200
          done
          for p in server.js test/surgeforce.test.js .git/config; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8520/$p")
            echo "$code $p (must be 404)"; test "$code" = 404
          done

  e2e:
    name: End-to-end in Chromium (every tab, report triage, all three tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/e2e.mjs
