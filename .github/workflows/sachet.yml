# Keeps data/sachet.json fresh (hourly): NDMA SACHET has no CORS, so the browser reads this saved copy instead.
name: SACHET alerts snapshot
on:
  schedule:
    - cron: '7 * * * *' # hourly: each refresh also redeploys Pages
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-sachet.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sachet.json
          git diff --cached --quiet || (git commit -m "Update SACHET alerts snapshot" && git push)
